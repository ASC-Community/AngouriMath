codecov:
  require_ci_to_pass: no

coverage:
  precision: 2
  round: down
  range: "50...100"
  # Under status, which is where Codecov reads them. Written directly under coverage, as they
  # were from 2021, they made the file invalid, and for an invalid file Codecov "keep[s] using
  # the last valid YAML provided" (https://docs.codecov.com/docs/codecov-yaml). This one had
  # never been valid, so none of it applied, the flags below included. Check an edit with
  #   curl -s -X POST --data-binary @.github/codecov.yml https://api.codecov.io/validate
  status:
    # The project figure is compared with the base commit's, and with no threshold any fall at
    # all fails: #2171 was red at -0.02%, five lines a new guard returns before. A percent lets
    # the ordinary movement of a change through and still fails a leg whose report goes empty,
    # which moved the figure from 86.41% to 0.38%.
    project:
      default:
        threshold: 1%
    patch: no
    changes: no

# Flags are declared so that each one is scoped to the code it actually measures and is
# carried forward when its leg does not run. Both matter here: every flag is uploaded from
# exactly one operating system of its matrix (csharp from windows, fsharp, interactive and
# cpp from ubuntu), so on any run where that leg is skipped an undeclared flag reports as
# missing rather than unchanged, and the report reads as a coverage drop that did not
# happen. https://github.com/asc-community/AngouriMath/issues/397
flags:
  csharp:
    paths:
      - Sources/AngouriMath/
    carryforward: true
  fsharp:
    paths:
      - Sources/Wrappers/AngouriMath.FSharp/
    carryforward: true
  interactive:
    paths:
      - Sources/Wrappers/AngouriMath.Interactive/
      - Sources/Terminal/
    carryforward: true
  cpp:
    paths:
      - Sources/Wrappers/AngouriMath.CPP.Importing/
    carryforward: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no
