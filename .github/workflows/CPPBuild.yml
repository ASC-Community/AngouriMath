name: 'C++ Build'

# A path filter is a glob matched against paths relative to the repository root, and the leading
# "./" these patterns carried matches nothing: from the day the filter was added (f51c7e03,
# 2026-01-02) this workflow ran zero times, while three commits touching the very directories it
# names were merged. It is the same defect that silenced Benchmark.yml for ninety-eight PRs --
# see the comment at the top of that file, and
# https://github.com/asc-community/AngouriMath/issues/775.
#
# The kernel is in the list because the exported native library is compiled from it, so a kernel
# change is exactly what can break this build; and this file is in the list so that a change to
# these filters demonstrates itself rather than being reasoned about.
on:
  push:
    branches:
      - master
    paths:
      - "Sources/Wrappers/AngouriMath.CPP.*/**"
      - "Sources/AngouriMath/**"
      - ".github/workflows/CPPBuild.yml"
  pull_request:
    branches:
      - '*'
    paths:
      - "Sources/Wrappers/AngouriMath.CPP.*/**"
      - "Sources/AngouriMath/**"
      - ".github/workflows/CPPBuild.yml"
  workflow_dispatch:

jobs:
  AngouriMathCpp:

    strategy:
        matrix:
          include:
          - os: windows-latest
            flag: win-x64
          - os: ubuntu-latest
            flag: linux-x64
          - os: macos-latest
            flag: osx-arm64
  
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'
        dotnet-quality: 'preview'

    - name: 'Generating exports'
      run: |
        cd Sources/Utils
        dotnet run -p Utils ExportsGenerator
        
    - name: 'Install some libs for Linux'
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y zlib1g-dev libkrb5-dev

    - name: 'Building the library into native for Windows'
      if: ${{ matrix.os == 'windows-latest' }}
      shell: cmd
      run: |
        cd Sources/Wrappers/AngouriMath.CPP.Exporting
        mkdir ../AngouriMath.CPP.Importing/out-x64
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        dotnet publish -p:NativeLib=Shared -p:SelfContained=true -r ${{ matrix.flag }} -c release
        
    - name: 'Building the library into native for Linux & MacOS'
      if: ${{ matrix.os != 'windows-latest' }}
      run: |
        cd Sources/Wrappers/AngouriMath.CPP.Exporting
        mkdir ../AngouriMath.CPP.Importing/out-x64
        dotnet publish -p:NativeLib=Shared -p:SelfContained=true -r ${{ matrix.flag }} -c release

    - name: 'Renaming the library for Linux'
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        cd Sources/Wrappers/AngouriMath.CPP.Importing/out-x64
        mv AngouriMath.CPP.Exporting.so libAngouriMath.CPP.Exporting.so
        
    - name: 'Renaming the library for OS X'
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        cd Sources/Wrappers/AngouriMath.CPP.Importing/out-x64
        mv AngouriMath.CPP.Exporting.dylib libAngouriMath.CPP.Exporting.dylib
        install_name_tool -id "@rpath/libAngouriMath.CPP.Exporting.dylib" libAngouriMath.CPP.Exporting.dylib

    - name: 'Uploading artifacts'
      uses: actions/upload-artifact@v6
      with:
        name: AngouriMath.CPP-${{ matrix.os }}-x64
        path: ./Sources/Wrappers/AngouriMath.CPP.Importing
        retention-days: 3
        
    - name: 'Building AngouriMath.Importing'
      run: |
        cd Sources/Wrappers/AngouriMath.CPP.Importing
        cmake -S . -B build
        cmake --build build

