name: 'Upload to NuGet'

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'
          
      - uses: actions/checkout@v6
        
      - name: 'Determine version'
        id: version
        run: |
          tagname="${{ github.event.release.tag_name }}"

          # Validate tag name exists
          if [[ -z "$tagname" ]]; then
            echo "Error: Release tag name is empty"
            exit 1
          fi

          # Remove 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
          version="${tagname#v}"
          echo "Release tag is $tagname"
          echo "Package version is $version"

          # Validate version format (SemVer 2.0.0: X.Y.Z[-prerelease][+build])
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Error: Invalid version format '$version'."
            echo "Expected semantic version (e.g., 1.0.0, 1.0.0-beta.1, 1.0.0+build.123)"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT

          # Four numbers: the version without its prerelease or build suffix, and a zero.
          echo "file_version=${version%%[-+]*}.0" >> $GITHUB_OUTPUT

      - name: 'Pack and publish AngouriMath'
        run: |
          cd Sources/AngouriMath
          dotnet restore AngouriMath.csproj
          dotnet build AngouriMath.csproj -c release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack AngouriMath.csproj -c release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          cd bin/release
          dotnet nuget push AngouriMath.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_KEY }} --source nuget.org
          
      - name: 'Pack and publish AngouriMath.FSharp'
        run: |
          cd Sources/Wrappers/AngouriMath.FSharp
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          cd bin/Release
          dotnet nuget push AngouriMath.FSharp.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_KEY }} --source nuget.org
          
      - name: 'Pack and publish AngouriMath.Interactive'
        run: |
          cd Sources/Wrappers/AngouriMath.Interactive
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          cd bin/Release
          dotnet nuget push AngouriMath.Interactive.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_KEY }} --source nuget.org
          
      - name: 'Pack and publish AngouriMath.Terminal'
        run: |
          cd Sources/Terminal/AngouriMath.Terminal
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          cd bin/Release
          dotnet nuget push AngouriMath.Terminal.${{ steps.version.outputs.version }}.nupkg --api-key ${{ secrets.NUGET_KEY }} --source nuget.org
