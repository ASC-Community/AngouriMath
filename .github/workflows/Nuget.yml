name: 'Upload to NuGet'

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          
      - uses: actions/checkout@v6
        
      - name: 'Determine version'
        id: version
        run: |
          tagname="${{ github.event.release.tag_name }}"

          # Validate tag name exists
          if [[ -z "$tagname" ]]; then
            echo "Error: Release tag name is empty"
            exit 1
          fi

          # Remove 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
          version="${tagname#v}"
          echo "Release tag is $tagname"
          echo "Package version is $version"

          # Validate version format (SemVer 2.0.0: X.Y.Z[-prerelease][+build])
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Error: Invalid version format '$version'."
            echo "Expected semantic version (e.g., 1.0.0, 1.0.0-beta.1, 1.0.0+build.123)"
            exit 1
          fi

          echo "version=$version" >> $GITHUB_OUTPUT

          # Four numbers: the version without its prerelease or build suffix, and a zero.
          echo "file_version=${version%%[-+]*}.0" >> $GITHUB_OUTPUT

      - name: 'Pack AngouriMath'
        run: |
          cd Sources/AngouriMath
          dotnet restore AngouriMath.csproj
          dotnet build AngouriMath.csproj -c release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack AngouriMath.csproj -c release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}

      - name: 'Pack AngouriMath.FSharp'
        run: |
          cd Sources/Wrappers/AngouriMath.FSharp
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}

      - name: 'Pack AngouriMath.Interactive'
        run: |
          cd Sources/Wrappers/AngouriMath.Interactive
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}

      - name: 'Pack AngouriMath.Terminal'
        run: |
          cd Sources/Terminal/AngouriMath.Terminal
          dotnet restore
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}
          dotnet pack -c Release -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.file_version }}

      - name: 'NuGet login'
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Happypig375

      - name: 'Publish AngouriMath'
        run: dotnet nuget push Sources/AngouriMath/bin/release/AngouriMath.${{ steps.version.outputs.version }}.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source nuget.org

      - name: 'Publish AngouriMath.FSharp'
        run: dotnet nuget push Sources/Wrappers/AngouriMath.FSharp/bin/Release/AngouriMath.FSharp.${{ steps.version.outputs.version }}.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source nuget.org

      - name: 'Publish AngouriMath.Interactive'
        run: dotnet nuget push Sources/Wrappers/AngouriMath.Interactive/bin/Release/AngouriMath.Interactive.${{ steps.version.outputs.version }}.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source nuget.org

      - name: 'Publish AngouriMath.Terminal'
        run: dotnet nuget push Sources/Terminal/AngouriMath.Terminal/bin/Release/AngouriMath.Terminal.${{ steps.version.outputs.version }}.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source nuget.org
