name: 'Interactive Test'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  Test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    # id-token is what the codecov step signs in with. Naming one permission sets every other to
    # none, so contents: read is there for the checkout.
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'
        dotnet-quality: 'preview'

    - name: Build Tests # We need it to be able to retry
      run: |
        dotnet build Sources/Tests/InteractiveWrapperUnitTests -c Release
        dotnet build Sources/Tests/TerminalUnitTests -c Release
        dotnet build Sources/Tests/McpUnitTests -c Release
        
    - name: Test Interactive Wrapper
      if: ${{ matrix.os != 'ubuntu-latest' }}
      run: |
        dotnet test "Sources/Tests/InteractiveWrapperUnitTests" -c Release

    - name: Test Terminal Lib
      if: ${{ matrix.os != 'ubuntu-latest' }}
      run: |
        dotnet test "Sources/Tests/TerminalUnitTests" -c Release

    # The server amcli mcp runs. It builds against the library in this repository, so a change
    # that moves an answer its documents describe, or a function the grammar gains or loses,
    # fails here rather than after a release.
    - name: Test MCP server
      if: ${{ matrix.os != 'ubuntu-latest' }}
      run: |
        dotnet test "Sources/Tests/McpUnitTests" -c Release

    - name: Test with coverage
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        dotnet test "Sources/Tests/InteractiveWrapperUnitTests" -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        dotnet test "Sources/Tests/TerminalUnitTests" -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        dotnet test "Sources/Tests/McpUnitTests" -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    # Codecov takes an upload from a branch of this repository only with a token, and without one
    # it rejected them while this step stayed green: master's newest report there is from
    # 2022-11-28. use_oidc gets a token for the run; on a fork's pull request the action skips it,
    # and Codecov takes that upload without one. A rejected upload fails the run on a push to
    # master only, so that an outage at Codecov does not fail a pull request. See
    # Sources/AngouriMath/Docs/Contributing/Coverage.md.
    - name: 'Send to codecov'
      if: ${{ matrix.os == 'ubuntu-latest' }}
      uses: codecov/codecov-action@v5
      with:
        directory: ./coverage
        flags: interactive
        use_oidc: true
        fail_ci_if_error: ${{ github.event_name == 'push' }}
